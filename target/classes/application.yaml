server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      routes:
        - id: dummy_service_route
          uri: https://jsonplaceholder.typicode.com
          predicates:
            - Path=/dummy/**
          filters:
            - StripPrefix=1